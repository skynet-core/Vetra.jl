name: Julia CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        os: [ubuntu-latest]
        include:
          - julia: '1'
            os: windows-latest
          - julia: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Fetch pinned upstream reference (fonts and test assets)
        run: julia --startup-file=no --project=. scripts/fetch_upstream.jl
      - name: Run package tests with bounds checks
        run: julia --startup-file=no --project=. scripts/check.jl
